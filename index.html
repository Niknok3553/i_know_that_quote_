<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>I Know That Quote</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <img src="favicon.png" alt="Logo" class="logo">

    <div class="wrapper">
        <h1>I KNOW THAT QUOTE</h1>

        <div class="scanner">
            <button id="scanButton">Scan QR-kode</button>
            <div id="reader"></div>
        </div>

        <div class="container">
            <h1>Lydafspiller</h1>
            <div class="player">
                <button id="playButton">
                    <span class="play-icon">▶</span>

                    <div class="waves">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </button>

                <audio id="player"></audio>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        const lydfiler = {
            kort1: "lyd/quote1.mp3",
            kort2: "lyd/quote2.mp3",
            kort3: "lyd/quote3.mp3",
            kort4: "lyd/quote4.mp3",
            kort5: "lyd/quote5.mp3",
            kort6: "lyd/quote6.mp3",
            kort7: "lyd/quote7.mp3",
            kort8: "lyd/quote8.mp3",
            kort9: "lyd/quote9.mp3",
            kort10: "lyd/quote10.mp3",
            kort11: "lyd/quote11.mp3",
            kort12: "lyd/quote12.mp3",
            kort13: "lyd/quote13.mp3",
            kort14: "lyd/quote14.mp3"
        };

        const player = document.getElementById("player");
        const playButton = document.getElementById("playButton");
        const scanButton = document.getElementById("scanButton");
        const reader = document.getElementById("reader");
        const container = document.querySelector(".container");

        // Hvis siden er åbnet med ?id=kort1
        const pageId = new URLSearchParams(window.location.search).get("id");

        // Hvis der allerede er et kort valgt
        if (lydfiler[pageId]) {
            player.src = lydfiler[pageId];
        }

        // Play-knappen
        playButton.addEventListener("click", () => {
            player.play();
        });


        // QR-SCANNER
        let html5QrCode;

        scanButton.addEventListener("click", () => {

            scanButton.style.display = "none";
            reader.style.display = "block";

            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },

                {
                    fps: 10,
                    qrbox: 250
                },

                (decodedText) => {

                    console.log("QR fundet:", decodedText);
                    alert("QR-koden indeholder:\n\n" + decodedText);

                    html5QrCode.stop().then(() => {

                        // Find ?id=kort1 i QR-koden
                        try {

                            const url = new URL(decodedText);
                            const scannedId = url.searchParams.get("id");

                            console.log("Kort:", scannedId);

                            // Find lydfilen
                            if (lydfiler[scannedId]) {

                                player.src = lydfiler[scannedId];
                                player.load();

                                // Vis afspilleren
                                container.style.display = "block";

                                // Prøv at starte lyden
                                player.play().catch(() => {
                                    console.log("Tryk på play for at starte lyden.");
                                });

                            } else {

                                alert("Jeg kunne ikke finde dette kort.");

                            }

                        } catch (error) {

                            console.error(error);

                            alert("QR-koden kunne ikke læses.");

                        }

                        // Luk kameraet
                        reader.style.display = "none";

                        // Vis scan-knappen igen
                        scanButton.style.display = "block";

                    });

                },

                () => {
                    // Ignorer scanning-fejl
                }

            ).catch((error) => {

                console.error(error);

                reader.style.display = "none";
                scanButton.style.display = "block";

                alert("Kameraet kunne ikke startes.");

            });

        });
    </script>



</body>

</html>
