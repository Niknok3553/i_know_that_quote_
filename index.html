<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>I Know That Quote</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <img src="favicon.png" alt="Logo" class="logo">

    <div class="wrapper">
        <h1>I KNOW THAT QUOTE</h1>

        <div class="scanner">
            <button id="scanButton">Scan QR-kode</button>
            <div id="reader"></div>
        </div>

        <div class="container">
            <h1>Lydafspiller</h1>
            <div class="player">
                <button id="playButton">
                    <span class="play-icon">▶</span>

                    <div class="waves">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </button>

                <audio id="player"></audio>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        const lydfiler = {
            kort1: "lyd/quote1.mp3",
            kort2: "lyd/quote2.mp3",
            kort3: "lyd/quote3.mp3",
            kort4: "lyd/quote4.mp3",
            kort5: "lyd/quote5.mp3",
            kort6: "lyd/quote6.mp3",
            kort7: "lyd/quote7.mp3",
            kort8: "lyd/quote8.mp3",
            kort9: "lyd/quote9.mp3",
            kort10: "lyd/quote10.mp3",
            kort11: "lyd/quote11.mp3",
            kort12: "lyd/quote12.mp3",
            kort13: "lyd/quote13.mp3",
            kort14: "lyd/quote14.mp3"
        };

        const player = document.getElementById("player");
        const playButton = document.getElementById("playButton");
        const scanButton = document.getElementById("scanButton");
        const reader = document.getElementById("reader");
        const container = document.querySelector(".container");

        // Hvis siden åbnes direkte med ?id=kort1
        const pageId = new URLSearchParams(window.location.search).get("id");

        if (lydfiler[pageId]) {
            player.src = lydfiler[pageId];
        }

        // Play-knap
        playButton.addEventListener("click", () => {
            player.play();
        });


        // =========================
        // QR SCANNER
        // =========================

        let html5QrCode = null;
        let qrFound = false;

        scanButton.addEventListener("click", () => {

            scanButton.style.display = "none";
            reader.style.display = "block";

            qrFound = false;

            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                {
                    facingMode: "environment"
                },
                {
                    fps: 10,
                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                // QR-KODE FUNDET
                (decodedText) => {

                    // Undgå at scanne samme QR flere gange
                    if (qrFound) return;

                    qrFound = true;

                    console.log("QR fundet:", decodedText);

                    // Find ?id=kort1
                    const match = decodedText.match(/[?&]id=(kort[0-9]+)/);

                    if (!match) {
                        console.log("QR-koden har ikke et kort-id.");
                        qrFound = false;
                        return;
                    }

                    const scannedId = match[1];

                    console.log("Kort fundet:", scannedId);

                    // Find lydfil
                    const lyd = lydfiler[scannedId];

                    if (!lyd) {
                        console.log("Ingen lydfil til:", scannedId);
                        qrFound = false;
                        return;
                    }

                    // Stop kameraet
                    html5QrCode.stop().then(() => {

                        reader.style.display = "none";
                        scanButton.style.display = "block";

                        // Sæt lyd
                        player.src = lyd;
                        player.load();

                        // Afspil med det samme
                        player.play().catch(error => {
                            console.log("Automatisk afspilning blokeret:", error);
                        });

                    }).catch(error => {
                        console.error("Kunne ikke stoppe kamera:", error);
                    });

                },

                // Ignorer almindelige scanning-fejl
                (errorMessage) => {
                }

            ).catch(error => {

                console.error("Kunne ikke starte QR-scanner:", error);

                reader.style.display = "none";
                scanButton.style.display = "block";
            });

        });
    </script>



</body>

</html>
