<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>I Know That Quote</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <img class="logo" src="logo2.png" alt="Logo">

    <div class="wrapper">

        <div class="scanner">
            <button id="scanButton">Scan QR-kode</button>
        </div>

        <div class="container">
            <h2>Lydafspiller</h2>
            <div class="player">
                <button id="playButton">
                    <span class="play-icon">▶</span>

                    <div class="waves">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </button>

                <audio id="player"></audio>
            </div>
        </div>
    </div>

    <!-- FULDskærms QR-SCANNER -->
    <div id="scannerOverlay">

        <button id="closeScanner" type="button">
            ✕ Luk scanner
        </button>

        <div id="reader"></div>

    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        const lydfiler = {
            kort1: "lyd/quote1.mp3",
            kort2: "lyd/quote2.mp3",
            kort3: "lyd/quote3.mp3",
            kort4: "lyd/quote4.mp3",
            kort5: "lyd/quote5.mp3",
            kort6: "lyd/quote6.mp3",
            kort7: "lyd/quote7.mp3",
            kort8: "lyd/quote8.mp3",
            kort9: "lyd/quote9.mp3",
            kort10: "lyd/quote10.mp3",
            kort11: "lyd/quote11.mp3",
            kort12: "lyd/quote12.mp3",
            kort13: "lyd/quote13.mp3",
            kort14: "lyd/quote14.mp3"
        };

        const player = document.getElementById("player");
        const playButton = document.getElementById("playButton");
        const scanButton = document.getElementById("scanButton");
        const reader = document.getElementById("reader");
        const scannerOverlay = document.getElementById("scannerOverlay");
        const closeScanner = document.getElementById("closeScanner");
        const container = document.querySelector(".container");

        // Hvis siden åbnes direkte med ?id=kort1
        const pageId = new URLSearchParams(window.location.search).get("id");

        if (lydfiler[pageId]) {
            player.src = lydfiler[pageId];
        }

        // Play-knap
        playButton.addEventListener("click", () => {
            player.play();
        });


        // =========================
        // QR SCANNER
        // =========================


        let html5QrCode = null;
        let qrFound = false;

        // Åbn QR-scanner
        scanButton.addEventListener("click", async () => {

            scannerOverlay.classList.add("active");

            document.body.style.overflow = "hidden";

            qrFound = false;

            try {
                html5QrCode = new Html5Qrcode("reader");

                await html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: (width, height) => {
                            const size = Math.min(
                                width * 0.75,
                                height * 0.75,
                                280
                            );

                            return {
                                width: Math.floor(size),
                                height: Math.floor(size)
                            };
                        }
                    },

                    // QR-KODE FUNDET
                    async (decodedText) => {

                        if (qrFound) return;

                        const match = decodedText.match(
                            /[?&]id=(kort[0-9]+)/
                        );

                        if (!match) {
                            console.log("QR-koden har ikke et kort-id.");
                            return;
                        }

                        const scannedId = match[1];
                        const lyd = lydfiler[scannedId];

                        if (!lyd) {
                            console.log("Ingen lydfil til:", scannedId);
                            return;
                        }

                        qrFound = true;

                        try {
                            await html5QrCode.stop();
                            html5QrCode.clear();

                            scannerOverlay.classList.remove("active");

                            document.body.style.overflow = "";
                            scanButton.style.display = "block";

                            player.src = lyd;
                            player.load();

                            player.play().catch(error => {
                                console.log(
                                    "Automatisk afspilning blokeret:",
                                    error
                                );
                            });

                        } catch (error) {
                            console.error("Fejl ved stop af scanner:", error);
                        }
                    },

                    // Ignorer almindelige scanningsfejl
                    () => { }

                );

            } catch (error) {
                console.error("Kunne ikke starte QR-scanner:", error);

                scannerOverlay.classList.remove("active");
                document.body.style.overflow = "";

                scanButton.style.display = "block";

                alert("Kameraet kunne ikke starte. Tjek kameraadgang og HTTPS.");
            }
        });

        // Luk scanner manuelt
        closeScanner.addEventListener("click", async () => {

            if (html5QrCode) {
                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                    }

                    html5QrCode.clear();

                } catch (error) {
                    console.error("Fejl ved lukning:", error);
                }
            }

            scannerOverlay.classList.remove("active");

            document.body.style.overflow = "";

            scanButton.style.display = "block";

            qrFound = false;
        });
    </script>



</body>

</html>
